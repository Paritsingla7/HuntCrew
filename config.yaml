# HuntCrew — single source of truth for tunables. Swap models/paths here, not in code.

llm:
  model: mistral/ministral-14b-latest   # LiteLLM model string; key from env MISTRAL_API_KEY
  temperature: 0.0
  max_tokens: 4000
  max_retries: 5
  min_interval_s: 2.1                   # measured via response headers: 30 requests/minute for this model
  tokens_per_minute: 700000             # measured: 937,500 tokens/minute; keep headroom
  cache_dir: .cache/llm
  # Per-model throttle overrides, measured from response headers on 2026-11-04 (limit with headroom). A model not listed
  # here uses min_interval_s / tokens_per_minute above. Larger Mistral models return a request limit of 0 on this key.
  model_limits:
    mistral/ministral-3b-latest: {min_interval_s: 0.1, tokens_per_minute: 1000000}    # 750 req/min, 1.3M tokens/min
    mistral/ministral-8b-latest: {min_interval_s: 0.4, tokens_per_minute: 500000}     # 188 req/min, 625k tokens/min
    mistral/open-mistral-nemo: {min_interval_s: 0.4, tokens_per_minute: 500000}       # 188 req/min, 625k tokens/min

rag:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  top_k: 5
  persist_dir: .cache/chroma

data:
  cic_parquet: data/external/cic-ids2017/CICIDS_Flow.parquet
  attack_stix: data/external/attack-stix/enterprise-attack.json
  policy: data/policy/policy.json

digest:
  max_private: 40              # every in-network source is listed up to this cap
  public_top_k: 6              # per neutral view (flows, ports, destinations, bytes, regularity)

replay:
  window_minutes: 5
  history_windows: 12          # how far back the agent's tools may look; never forward

labels:
  in_scope: [BENIGN, FTP-Patator, SSH-Patator, Bot, PortScan,
             DoS Hulk, DoS GoldenEye, DoS slowloris, DoS Slowhttptest, DDoS,
             "Web Attack – Brute Force", "Web Attack – XSS", "Web Attack – Sql Injection"]   # last 8: fresh split, ADR-037
  # Hand-made mapping, published in docs/label-mapping.md. Grading is parent-level:
  # a truth of T1110 accepts T1110 or any T1110.xxx sub-technique.
  to_technique:
    FTP-Patator: T1110
    SSH-Patator: T1110
    Bot: T1071
    PortScan: T1046
    # Added for the fresh split (ADR-037), fixed before any fresh result. HTTP floods and slow-HTTP attacks exhaust the
    # web service: Endpoint Denial of Service. Web login guessing is Brute Force; XSS and SQL injection exploit a
    # public-facing web application.
    DoS Hulk: T1499
    DoS GoldenEye: T1499
    DoS slowloris: T1499
    DoS Slowhttptest: T1499
    DDoS: T1499
    "Web Attack – Brute Force": T1110
    "Web Attack – XSS": T1190
    "Web Attack – Sql Injection": T1190
  match_level: parent

# Pre-registered on 2026-10-15, before any detector result existed (ADR-019). Do not edit after results.
# Tune/dev choices (digest statistics, B0 thresholds) may use `dev` and `baseline_benign` only.
splits:
  baseline_benign: {start: "2017-07-03 09:00", end: "2017-07-03 17:00"}   # Monday: benign only
  dev:
    - {name: ftp_patator, start: "2017-07-04 09:00", end: "2017-07-04 10:45"}
  test:
    - {name: ssh_patator, start: "2017-07-04 14:00", end: "2017-07-04 15:30"}
    - {name: bot,         start: "2017-07-07 10:00", end: "2017-07-07 12:00"}
    - {name: portscan,    start: "2017-07-07 14:00", end: "2017-07-07 15:30"}
  # Never used by any earlier run (ADR-037): other attack families (Wed DoS, Thu web attacks, Fri DDoS) and unused
  # stretches of the same Bot and PortScan activity. Declared on 2026-11-04 before any system was run on them.
  # (A 09:30-10:00 Bot stretch was dropped: it has no attack-positive pair under the grading rule, from labels alone.)
  fresh:
    - {name: bot_fresh_pm,    start: "2017-07-07 12:00", end: "2017-07-07 13:00"}
    - {name: portscan_fresh,  start: "2017-07-07 13:00", end: "2017-07-07 14:00"}
    - {name: ddos_fri,        start: "2017-07-07 15:45", end: "2017-07-07 16:30"}
    - {name: dos_wed,         start: "2017-07-05 10:30", end: "2017-07-05 11:30"}
    - {name: web_thu,         start: "2017-07-06 09:00", end: "2017-07-06 10:45"}

# B0 baseline only (a classic rules engine). The agent detector does NOT use these.
baseline_rules:                # evaluated per replay window
  password_guessing: {min_flows: 50, ports: [21, 22]}
  port_scan: {min_distinct_ports: 100}
  beaconing: {min_flows: 10, min_active_minutes: 3, max_cv: 0.3, require_rare_destination: true}

# Pre-registered bar for "agent detector is usable" (ADR-019). If missed -> B2-hybrid.
decision_gate:
  min_recall_vs_b0: 0.70       # agent recall >= 70% of B0 recall on dev
  max_fp_ratio_vs_b0: 2.0      # agent false-positive incidents <= 2x B0's

# Fixed before any detector result existed. A (window, entity) is attack-positive when it has at least
# this many attack-labelled flows from that source in the window.
grading:
  min_attack_flows: 5

# Post-hoc, no-LLM comparison baselines (ADR-031, added 2026-11-04 AFTER the frozen test run, so they are
# reported as post-hoc). Every value was fixed before the formal run, was not chosen from test results, and
# is fitted on `baseline_benign` only. Features are per (window, source) and use the current window alone.
cheap_baselines:
  min_flows: 10                # a source needs at least this many flows in the window to be flagged
  features: [flows, dst_ips, dst_ports, fwd_bytes, syn, rst, max_ports_per_dst, top_port_share]
  quantile:                    # b2: flag if any feature exceeds its q-quantile over benign (window, source) rows
    q: 0.995
  isolation_forest:            # b3: unsupervised outlier score; flag above the benign-score quantile
    n_estimators: 200
    flag_quantile: 0.995
    random_state: 0
  # b4 = B0 rule findings kept only when b2 also flags the source: the "no-LLM triage filter" that the
  # hybrid's LLM verification has to beat.

# Uncertainty report (ADR-033): paired bootstrap over replay windows, computed from saved per-window predictions.
bootstrap:
  n: 2000
  seed: 0
  level: 0.95
  comparisons:                 # [a, b] -> interval for F1(a) - F1(b); post-hoc comparisons, listed once, here
    - [hybrid, b0]
    - [hybrid, agent]
    - [hybrid, b4]
    - [agent, b2]
    - [union, hybrid]
